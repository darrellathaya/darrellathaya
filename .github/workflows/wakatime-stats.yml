name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&rank_icon=github&show=prs_merged,prs_merged_percentage,&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate WakaTime
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=${{ secrets.WAKATIME_USER_ID }}&display_format=time&theme=radical
          path: profile/wakatime.svg
          token: ${{ secrets.WAKATIME_API_KEY }}

      # - name: Generate Gist
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: gist
      #     options: id=0123456789abcdef
      #     token: ${{ secrets.PAT }}

      # - name: Generate pin card
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: pin
      #     options: username=stats-organization&repo=github-readme-stats
      #     path: profile/pin-stats-organization-github-readme-stats.svg
      #     token: ${{ secrets.GH_TOKEN }}
      
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: profile/full-year-calendar.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Detailed report
        uses: lowlighter/metrics@latest
        with:
          filename: profile/detailed.svg
          token: NOT_NEEDED
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://lecoq.io


      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push